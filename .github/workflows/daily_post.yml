name: Daily X Post

on:
  schedule:
    # 毎日 JST 8:17 に実行（UTCでは前日23:17）。毎時00分ちょうどはGitHub側が混雑しやすく遅延の原因になるため、分数をズラしている
    - cron: '17 23 * * *'
  workflow_dispatch: {}   # 手動実行用（テストに便利）

permissions:
  contents: write   # topics_log.json をコミットし直すために必要

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate content and post to X
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run post

      - name: Commit updated topic log
        run: |
          git config user.name "auto-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/topics_log.json
          git diff --staged --quiet || git commit -m "chore: update topic log [skip ci]"
          git push
